# Configurazione minima per la CLI di Supabase (serve solo a pubblicare la Edge Function)
project_id = "casti_tesla"

[functions.leggi_shelly]
enabled = true
# l'accesso lo controlla la funzione stessa (@supabase/server, chiave publishable)
verify_jwt = false
import_map = "./functions/leggi_shelly/deno.json"

[functions.gestisci_utenti]
enabled = true
# l'accesso lo controlla la funzione (utente collegato + amministratore)
verify_jwt = false
import_map = "./functions/gestisci_utenti/deno.json"

[functions.leggi_tesla]
enabled = true
# l'accesso lo controlla la funzione (chiave publishable; la "prova" solo per l'amministratore)
verify_jwt = false
import_map = "./functions/leggi_tesla/deno.json"
